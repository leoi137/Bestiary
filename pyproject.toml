[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bestiary"
version = "0.1.0"
description = "Legged robots built, trained, and documented in simulation."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

# Pinned to match requirements.txt. Torch is intentionally NOT listed: it
# ships as CUDA-specific wheels and must come from the PyTorch index, so it
# stays in requirements.txt where the --extra-index-url lives with it.
dependencies = [
    "gymnasium==1.2.3",
    "mujoco==3.8.1",
    "stable_baselines3==2.8.0",
    "imageio==2.37.3",
    "imageio-ffmpeg==0.6.0",
    "numpy==2.4.6",
    "tensorboard==2.20.0",
    "tqdm==4.67.3",
    "rich==15.0.0",
]

[project.optional-dependencies]
# Only needed to regenerate figures and terrain textures, not to train.
viz = ["matplotlib", "pillow"]
dev = ["ruff"]

[project.scripts]
bestiary-train = "bestiary.train.train:main"
bestiary-watch = "bestiary.train.watch:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
# E/W are style and deliberately not enforced — this codebase's comments are
# load-bearing prose and reflowing them to satisfy a linter would damage them.
#
# F is pyflakes, and it is enforced because it finds REAL bugs. F823 in
# particular ("local variable referenced before assignment") is what caught
# the shadowed `paths` that made the trainer unlaunchable — a whole entry
# point broken, invisible to the 38-assertion robot check, and found in
# milliseconds by this rule. See research/learnings/006.
select = ["F"]
